{% extends 'base.html' %}
{% block title %}Edit record{% endblock %}{% block heading %}Edit medical record #{{ r.record_id }}{% endblock %}
{% block content %}
<section class="card narrow">
  <form method="post" class="form-col">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Patient ID<input value="{{ r.patient_id }}" disabled></label>
    <label>Disease<input name="disease" maxlength="200" value="{{ r.disease or '' }}" required></label>
    <label>Treatment<input name="treatment" maxlength="300" value="{{ r.treatment or '' }}" required></label>
    <label>Medicine<input name="medicine" maxlength="300" value="{{ r.medicine or '' }}"></label>
    <div class="form-row"><button class="btn primary">Save</button><a class="btn ghost" href="{{ url_for('records') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
