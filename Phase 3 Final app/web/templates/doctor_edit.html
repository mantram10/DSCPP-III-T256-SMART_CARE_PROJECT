{% extends 'base.html' %}
{% block title %}Edit doctor{% endblock %}{% block heading %}Edit doctor #{{ d.doctor_id }}{% endblock %}
{% block content %}
<section class="card narrow">
  <form method="post" class="form-col">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Doctor ID<input value="{{ d.doctor_id }}" disabled></label>
    <label>Name<input name="name" maxlength="100" value="{{ d.name }}" required></label>
    <label>Specialization<input name="specialization" maxlength="100" value="{{ d.specialization or '' }}" required></label>
    <div class="form-row"><button class="btn primary">Save</button><a class="btn ghost" href="{{ url_for('doctors') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
