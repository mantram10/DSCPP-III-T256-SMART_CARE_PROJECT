<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartCare | Phase II</title>
<style>
:root{--ink:#18243a;--muted:#748199;--line:#e7ecf4;--bg:#f5f7fc;--white:#fff;--navy:#172744;--blue:#5277f7;--purple:#8967f8;--teal:#19b99a;--orange:#ffad55;--pink:#f4779b;--shadow:0 10px 30px rgba(35,53,91,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}button:active{transform:scale(.98)}
.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:linear-gradient(165deg,#182947 0%,#21395d 100%);color:white;padding:22px 15px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:3px 10px 27px}.brandicon{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#5c87ff,#8c6af8);display:grid;place-items:center;font-size:23px;box-shadow:0 7px 18px #4e70ed55}.brand strong{font-size:21px;letter-spacing:-.5px}.brand small{display:block;color:#aab9d4;font-size:9px;letter-spacing:1.4px;margin-top:3px}.section-label{font-size:10px;letter-spacing:1.5px;color:#8fa4c5;padding:11px 13px}.nav button{width:100%;border:0;background:transparent;color:#d4def0;padding:12px 13px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:12px;margin:3px 0}.nav button:hover{background:#ffffff12;color:white;transform:translateX(2px)}.nav button.active{background:linear-gradient(100deg,#5277f7,#7468ef);color:#fff;box-shadow:0 8px 20px #0b173b30}.nav .ico{font-size:17px;width:22px;text-align:center}.side-bottom{margin-top:auto;border-top:1px solid #ffffff18;padding:15px 11px;color:#aab9d4;font-size:11px;line-height:1.7}.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#31d4a5;margin-right:6px;box-shadow:0 0 0 4px #31d4a522}
main{min-width:0}.topbar{height:79px;background:#ffffffdb;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{font-size:11px;color:#98a3b7;margin-bottom:3px;letter-spacing:.5px}.topbar h1{font-size:22px;margin:0;letter-spacing:-.5px}.top-right{display:flex;align-items:center;gap:16px}.connection{font-size:11px;color:var(--muted);background:#f5f7fb;padding:8px 11px;border-radius:20px;border:1px solid var(--line)}.avatar{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#d8e4ff,#eee3ff);display:grid;place-items:center;color:#4b5fbd;font-weight:800}.user b{font-size:12px}.user small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.content{padding:27px 32px 38px;max-width:1600px;margin:auto;animation:fadeUp .35s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.hero{position:relative;overflow:hidden;border-radius:19px;background:linear-gradient(115deg,#4b6df4 0%,#7668ee 58%,#9c68e9 100%);padding:28px 30px;color:#fff;margin-bottom:21px;box-shadow:0 12px 28px #7668ee27}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff0d;pointer-events:none}.hero:before{width:240px;height:240px;right:8%;top:-130px}.hero:after{width:160px;height:160px;right:25%;bottom:-120px}.hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:18px}.hero h2{font-size:25px;margin:0 0 7px;letter-spacing:-.6px}.hero p{margin:0;color:#e5e8ff;font-size:13px}.hero-badge{padding:9px 12px;border-radius:12px;background:#ffffff20;border:1px solid #ffffff35;font-size:11px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:21px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;animation:fadeUp .45s ease both}.stat:hover{transform:translateY(-3px);box-shadow:0 15px 32px #263b6312}.stat:nth-child(2){animation-delay:.04s}.stat:nth-child(3){animation-delay:.08s}.stat:nth-child(4){animation-delay:.12s}.stathead{display:flex;justify-content:space-between;align-items:center;color:#7c879c;font-size:12px}.stat-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px}.stat strong{display:block;font-size:30px;letter-spacing:-1px;margin:13px 0 2px}.stat small{color:#98a2b5;font-size:11px}.layout2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:21px;margin-bottom:18px;min-width:0;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel h3{font-size:15px;margin:0;letter-spacing:-.2px}.muted{color:var(--muted)}.tiny{font-size:11px;color:#95a0b2;margin-top:4px}.btn{border:0;border-radius:9px;background:linear-gradient(110deg,#5277f7,#7669ee);color:white;padding:10px 14px;font-weight:650;font-size:12px;box-shadow:0 5px 12px #5277f71c}.btn:hover{box-shadow:0 8px 17px #5277f735;transform:translateY(-1px)}.btn.soft{background:#eef2ff;color:#4b64cf;box-shadow:none}.btn.ghost{background:white;color:#52617b;border:1px solid var(--line);box-shadow:none}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.action{background:#fbfcff;border:1px solid #e9edf5;border-radius:12px;padding:15px 13px;text-align:left;color:var(--ink)}.action:hover{background:#f6f7ff;border-color:#d5dcff;transform:translateY(-2px)}.action .action-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:12px}.action b{display:block;font-size:12px}.action small{display:block;color:#8c97aa;font-size:10px;margin-top:4px}
table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #eff2f7;padding:13px 10px;font-size:12px}th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#8995a9;font-weight:700;background:#fbfcfe}td{color:#3e4b61}tbody tr:hover{background:#fafbff}.scroll{overflow:auto}.tag{display:inline-block;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:700;background:#e6f8f1;color:#168268}.tag.red{background:#ffebef;color:#c43e57}.tag.amber{background:#fff3df;color:#a76b17}.tag.blue{background:#edf1ff;color:#4d63d2}.search{max-width:250px;width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;background:#fbfcfe;font-size:12px}.search:focus,input:focus,select:focus{border-color:#9baeff;outline:3px solid #e7ebff}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:11px;font-weight:700;color:#59677e;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #dfe5ef;border-radius:9px;padding:11px 12px;background:#fcfdff;color:var(--ink)}.field.full{grid-column:1/-1}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.empty{padding:25px;text-align:center;color:#98a2b5}.notice{border:1px solid #f2e4bd;background:#fff9e9;color:#89621d;padding:13px 15px;border-radius:11px;font-size:11px;line-height:1.7;margin-bottom:18px}.app-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 4px 5px;margin-top:6px;border-top:1px solid #e4eaf3;color:#8b96a9;font-size:11px}.app-footer .creator{color:#6f7c91}.app-footer b{color:#44536c;font-weight:700}.priority-list{display:grid;gap:9px}.priority-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #edf0f6;border-radius:11px;gap:10px}.priority-item b{font-size:12px}.priority-item small{display:block;color:#929db0;font-size:10px;margin-top:3px}.network{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.node{background:#f2f4ff;border:1px solid #dce2ff;color:#4e5fc3;border-radius:10px;padding:12px 14px;font-weight:700;font-size:12px}.arrow{color:#9aa6bb}.toast{position:fixed;bottom:24px;right:24px;background:#182b49;color:white;padding:13px 18px;border-radius:11px;box-shadow:0 12px 30px #1b2c4a33;z-index:20;display:none;animation:fadeUp .2s ease}.mobile-menu{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:22px}}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:13px}.brand{padding-bottom:13px}.section-label,.side-bottom{display:none}.nav{display:flex;gap:4px;overflow-x:auto}.nav button{white-space:nowrap;width:auto;padding:10px 12px}.nav .ico{display:none}.topbar{height:68px;padding:0 15px}.content{padding:14px}.hero{padding:21px}.hero-inner{display:block}.hero-badge{display:inline-block;margin-top:14px}.cards{gap:9px}.stat{padding:14px}.stat strong{font-size:25px}.panel{padding:15px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.user{display:none}.top-right{gap:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brandicon">✚</div><div><strong>SmartCare</strong><small>PHASE II • HEALTH SYSTEM</small></div></div><div class="section-label">WORKSPACE</div>
<nav class="nav" id="nav"><button class="active" data-page="Dashboard"><span class="ico">▦</span>Dashboard</button><button data-page="Patients"><span class="ico">♙</span>Patients</button><button data-page="Doctors"><span class="ico">⚕</span>Doctors</button><button data-page="Appointments"><span class="ico">▣</span>Appointments</button><button data-page="Emergency"><span class="ico">♥</span>Emergency Queue</button><button data-page="Medical Records"><span class="ico">▤</span>Medical Records</button></nav>
<div class="side-bottom"><span class="online-dot"></span><span id="sideStatus">Checking database…</span><br>SmartCare • Phase II evaluation<br><span style="display:block;margin-top:12px;color:#d9e4f5;font-weight:650">Created by Mantram Singh Panwar</span><span style="color:#9eb1cf">B.Tech CSE (AIML) · 3rd Semester</span></div></aside>
<main><header class="topbar"><div><div class="crumb">SMARTCARE / PHASE II</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-right"><div class="connection" id="conn">Connecting…</div><div class="avatar">SC</div><div class="user"><b>Administrator</b><small>Phase II project</small></div></div></header><section class="content" id="content"></section></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page="Dashboard",cache={patients:[],doctors:[],appointments:[],emergencies:[],medical_records:[]};
const endpoint={Patients:"patients",Doctors:"doctors",Appointments:"appointments",Emergency:"emergencies","Medical Records":"medical-records"};
function toast(t){let x=$("#toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2800)}
async function api(path,opts={}){let r=await fetch("/api/"+path,{headers:{"Content-Type":"application/json"},...opts});let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function refresh(){try{let h=await api("health");$("#conn").innerHTML='<span class="online-dot"></span>PostgreSQL connected';$("#sideStatus").textContent="Database connected";for(let [k,p] of Object.entries({patients:"patients",doctors:"doctors",appointments:"appointments",emergencies:"emergencies",medical_records:"medical-records"}))cache[k]=await api(p);render()}catch(e){$("#conn").textContent="Database offline";$("#sideStatus").textContent="Database offline";$("#content").innerHTML=`<div class="notice" style="color:#a52c43;background:#fff0f2;border-color:#f5ccd4"><b>Unable to connect to PostgreSQL.</b><br>${esc(e.message)}<br><br>Check that PostgreSQL is running, the database exists and the password entered in the launcher is correct.</div><button class="btn" onclick="refresh()">Retry connection</button>`}}
function table(heads,rows){return `<div class="scroll"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${heads.length}" class="empty">No records found yet.</td></tr>`}</tbody></table></div>`}
function stat(icon,label,value,bg){return `<div class="stat"><div class="stathead">${label}<span class="stat-icon" style="background:${bg}">${icon}</span></div><strong>${value}</strong><small>Live PostgreSQL count</small></div>`}
function dashboard(){return `<div class="hero"><div class="hero-inner"><div><h2>Welcome to SmartCare 👋</h2><p>A little more organised, a little more cared for — all in one place.</p></div><span class="hero-badge">✦ Phase II evaluation build</span></div></div><div class="cards">${stat("♙","Your patients",cache.patients.length,"#eaf0ff")}${stat("⚕","Doctors",cache.doctors.length,"#e4f9f1")}${stat("▣","Appointments",cache.appointments.length,"#fff1df")}${stat("♥","Emergency care",cache.emergencies.length,"#ffebf0")}</div>
<div class="panel"><div class="panel-head"><div><h3>What would you like to do?</h3><div class="tiny">Choose a task to get started</div></div></div><div class="actions"><button class="action" onclick="go('Patients')"><span class="action-icon" style="background:#eaf0ff;color:#4f6fe7">♙</span><b>Add a patient</b><small>Create a patient record</small></button><button class="action" onclick="go('Doctors')"><span class="action-icon" style="background:#e4f9f1;color:#139b7c">⚕</span><b>Add a doctor</b><small>Manage your care team</small></button><button class="action" onclick="go('Appointments')"><span class="action-icon" style="background:#fff1df;color:#c17c21">▣</span><b>Book a visit</b><small>Arrange patient care</small></button><button class="action" onclick="go('Emergency')"><span class="action-icon" style="background:#ffebf0;color:#d54e6b">♥</span><b>Add emergency case</b><small>Help prioritise urgent care</small></button></div></div>
<div class="layout2"><div class="panel"><div class="panel-head"><div><h3>Your patients</h3><div class="tiny">Recently added to your records</div></div><button class="btn soft" onclick="go('Patients')">View all →</button></div>${table(["Patient ID","Name","Age","Gender"],cache.patients.slice(-6).reverse().map(p=>[p.patient_id,esc(p.name),p.age??"—",esc(p.gender??"—")]))}</div><div class="panel"><div class="panel-head"><div><h3>Emergency care</h3><div class="tiny">Urgent cases are shown first</div></div><span class="tag red">Priority</span></div><div class="priority-list">${cache.emergencies.slice().sort((a,b)=>a.priority-b.priority).slice(0,5).map(e=>`<div class="priority-item"><div><b>${esc(e.patient_name||("Patient #"+e.patient_id))}</b><small>Patient ID ${e.patient_id}</small></div><span class="tag ${e.priority===1?"red":e.priority===2?"amber":"blue"}">Priority ${e.priority}</span></div>`).join("")||'<div class="empty">No emergency cases recorded.</div>'}</div></div></div><footer class="app-footer"><span>Made with care · SmartCare Healthcare System</span><span class="creator">Created by <b>Mantram Singh Panwar</b> · B.Tech CSE (AIML) · 3rd Semester</span></footer>`}
const configs={Patients:{key:"patients",title:"Patient management",fields:[["patient_id","Patient ID","number"],["name","Full name","text"],["age","Age","number"],["gender","Gender","select"]],heads:["ID","Name","Age","Gender"],rows:p=>[p.patient_id,esc(p.name),p.age??"—",esc(p.gender??"—")]},Doctors:{key:"doctors",title:"Doctor management",fields:[["doctor_id","Doctor ID","number"],["name","Doctor name","text"],["specialization","Specialization","text"]],heads:["ID","Name","Specialization"],rows:d=>[d.doctor_id,esc(d.name),esc(d.specialization??"—")]},Appointments:{key:"appointments",title:"Appointment management",fields:[["patient_id","Patient","patient"],["doctor_id","Doctor","doctor"]],heads:["Appointment ID","Patient","Doctor"],rows:a=>[a.appointment_id,esc(a.patient_name||a.patient_id),esc(a.doctor_name||a.doctor_id)]},Emergency:{key:"emergencies",title:"Emergency management",fields:[["patient_id","Patient","patient"],["priority","Priority (1–5)","priority"]],heads:["Case ID","Patient","Priority"],rows:e=>[e.emergency_id,esc(e.patient_name||e.patient_id),`<span class="tag ${e.priority===1?"red":e.priority===2?"amber":"blue"}">${e.priority}</span>`]},"Medical Records":{key:"medical_records",title:"Medical records",fields:[["patient_id","Patient","patient"],["diagnosis","Diagnosis","text"],["prescription","Prescription","text"]],heads:["Record ID","Patient","Diagnosis","Prescription"],rows:m=>[m.record_id,esc(m.patient_name||m.patient_id),esc(m.diagnosis||"—"),esc(m.prescription||"—")]}};
function field(f){let [key,label,type]=f;if(type==="patient"||type==="doctor"){let arr=cache[type==="patient"?"patients":"doctors"],id=type==="patient"?"patient_id":"doctor_id";return `<div class="field"><label>${label}</label><select name="${key}" required>${arr.map(x=>`<option value="${x[id]}">${x[id]} — ${esc(x.name)}</option>`).join("")}</select></div>`}if(type==="priority")return `<div class="field"><label>${label}</label><select name="${key}">${[1,2,3,4,5].map((n,i)=>`<option value="${n}">${n} — ${["Critical","Very serious","Serious","Moderate","Low"][i]}</option>`).join("")}</select></div>`;if(type==="select")return `<div class="field"><label>${label}</label><select name="${key}"><option>M</option><option>F</option><option>O</option></select></div>`;return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" ${type==="number"?'min="0"':''} required placeholder="Enter ${label.toLowerCase()}"></div>`}
function formPage(p){let c=configs[p];return `<div class="panel"><div class="panel-head"><div><h3>${c.title}</h3><div class="tiny">Records are read from and saved to PostgreSQL</div></div><button class="btn ghost" onclick="refresh()">↻ Refresh</button></div><form id="entry"><div class="formgrid">${c.fields.map(field).join("")}</div><button class="btn" type="submit">＋ Save to database</button></form></div><div class="panel"><div class="panel-head"><div><h3>${p} records</h3><div class="tiny">Live database table</div></div><input class="search" id="search" placeholder="Search records…"></div><div id="table">${table(c.heads,cache[c.key].map(c.rows))}</div></div>`}
function render(){if(page==="Dashboard"){$("#content").innerHTML=dashboard();return}if(configs[page]){$("#content").innerHTML=formPage(page);$("#entry").addEventListener("submit",async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{if(page==="Patients"){d.patient_id=Number(d.patient_id);d.age=Number(d.age)}if(page==="Doctors")d.doctor_id=Number(d.doctor_id);if(d.patient_id)d.patient_id=Number(d.patient_id);if(d.doctor_id)d.doctor_id=Number(d.doctor_id);if(d.priority)d.priority=Number(d.priority);await api(endpoint[page],{method:"POST",body:JSON.stringify(d)});toast("Saved to PostgreSQL");await refresh()}catch(err){toast(err.message)}});$("#search").addEventListener("input",e=>{let c=configs[page],q=e.target.value.toLowerCase();$("#table").innerHTML=table(c.heads,cache[c.key].filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(c.rows))});return}$("#content").innerHTML=dashboard()}
function go(p){page=p;$("#pageTitle").textContent=p;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});refresh();
</script></body></html>
